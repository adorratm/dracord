// --- PROCEDURAL TEXTURES ---
function createWoodTexture() {
  const cv = document.createElement('canvas');
  cv.width = 512; cv.height = 512;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#6d4529';
  ctx.fillRect(0, 0, 512, 512);
  for (let y = 0; y < 512; y += 32) {
    ctx.fillStyle = (y % 64 === 0) ? '#5a371e' : '#7b4e2d';
    ctx.fillRect(0, y, 512, 30);
    ctx.fillStyle = '#392110';
    ctx.fillRect(0, y + 30, 512, 2);
    for (let i = 0; i < 30; i++) {
      ctx.fillStyle = 'rgba(30, 15, 5, 0.1)';
      ctx.fillRect(Math.random() * 512, y + Math.random() * 28, Math.random() * 100 + 20, 1.5);
    }
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(4, 4);
  return tex;
}

function createRugTexture(hex) {
  const cv = document.createElement('canvas');
  cv.width = 256; cv.height = 256;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = hex;
  ctx.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 4000; i++) {
    ctx.fillStyle = Math.random() > 0.5 ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.12)';
    ctx.fillRect(Math.random() * 256, Math.random() * 256, 2, 2);
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(2, 2);
  return tex;
}

// Curved Couch Modules

const spanRad = Math.PI * 1.45;

  const theta = startRad + (i / cSegments) * spanRad;
  const nextTheta = startRad + ((i + 1) / cSegments) * spanRad;
  const midTheta = (theta + nextTheta) / 2;

  const seat = new THREE.Mesh(new THREE.BoxGeometry(1.65, 0.85, 1.4), purpleVelvetMat);
  seat.position.set(Math.cos(midTheta) * cRadius, 0.5, Math.sin(midTheta) * cRadius);

  seat.castShadow = true;
  seat.receiveShadow = true;

  back.position.set(Math.cos(midTheta) * (cRadius + 0.55), 1.0, Math.sin(midTheta) * (cRadius + 0.55));
  back.rotation.y = -midTheta + Math.PI / 2;
  back.castShadow = true;

  }
}

// --- 10. INTERACTIVE CONTROLS ---
const targetPos = new THREE.Vector3(-1.8, 0, 0);
const keys = {};

window.addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; });
window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

container.addEventListener('pointerdown', (e) => {
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects([floorMesh, terrace, couchRug, lowerRug]);
  if (hits.length > 0) {
    targetPos.copy(hits[0].point);
    targetPos.y = 0;
    targetPos.x = Math.max(-10.5, Math.min(10.5, targetPos.x));
    targetPos.z = Math.max(-10.5, Math.min(10.5, targetPos.z));
  }
});

// --- RENDER LOOP ---
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const time = clock.getElapsedTime();

  marker.rotation.y += 2.0 * dt;
  marker.position.y = 3.1 + Math.sin(time * 3.5) * 0.15;

  const aScale = 1.0 + Math.sin(time * 4) * 0.08;
  aura.scale.set(aScale, aScale, 1);

  lanternLight.intensity = 1.4 + Math.sin(time * 12) * 0.25;

  let mx = 0, mz = 0;
  if (keys['w'] || keys['arrowup']) { mx -= 1; mz -= 1; }
  if (keys['s'] || keys['arrowdown']) { mx += 1; mz += 1; }
  if (keys['a'] || keys['arrowleft']) { mx -= 1; mz += 1; }
  if (keys['d'] || keys['arrowright']) { mx += 1; mz += 1; }

  if (mx !== 0 || mz !== 0) {
    const spd = 7.5 * dt;
    avatar.position.x += mx * spd;
    avatar.position.z += mz * spd;
    targetPos.copy(avatar.position);
    avatar.rotation.y = Math.atan2(mx, mz);
    avatar.position.y = Math.abs(Math.sin(time * 14)) * 0.18;
  } else {
    const dist = avatar.position.distanceTo(targetPos);
    if (dist > 0.1) {
      const dir = new THREE.Vector3().subVectors(targetPos, avatar.position).normalize();
      avatar.position.addScaledVector(dir, Math.min(dist, 8.5 * dt));
      avatar.rotation.y = Math.atan2(dir.x, dir.z);
      avatar.position.y = Math.abs(Math.sin(time * 14)) * 0.18;
    } else {
      avatar.position.y = 0;
    }
  }

  avatar.position.x = Math.max(-10.5, Math.min(10.5, avatar.position.x));
  avatar.position.z = Math.max(-10.5, Math.min(10.5, avatar.position.z));

  renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
  const nw = container.clientWidth || window.innerWidth;
  const nh = container.clientHeight || window.innerHeight;
  const nAspect = nw / nh;
  camera.left = -d * nAspect;
  camera.right = d * nAspect;
  camera.top = d;
  camera.bottom = -d;
  camera.updateProjectionMatrix();
  renderer.setSize(nw, nh);
});
})();
</script>
