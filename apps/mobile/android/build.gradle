// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"

// Windows + Metro eşzamanlı çalışırken @expo/fingerprint ExpoConfigLoader
// arada exit 1 veriyor (build yine SUCCESS). Debug embed opsiyonel; gürültüyü kes.
gradle.taskGraph.whenReady { graph ->
  graph.allTasks.findAll { it.name == "createExpoFingerprint" }.each { task ->
    if (task instanceof Exec) {
      task.environment("EXPO_SKIP_FINGERPRINT_EMBED", "1")
    }
  }
}
