name: Desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
          - os: macos-latest
            script: build:mac
          - os: ubuntu-latest
            script: build:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        run: yarn install --immutable

      # Boş CSC_LINK/CSC_KEY_PASSWORD → electron-builder "not a file" hatası verir; yoksa unset et
      - name: Code-sign env (skip if no cert secrets)
        shell: bash
        env:
          CSC_LINK_SECRET: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD_SECRET: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD_SECRET: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}
          ASC_PROVIDER_SECRET: ${{ secrets.ASC_PROVIDER }}
        run: |
          set -euo pipefail
          if [ -n "${CSC_LINK_SECRET:-}" ]; then
            echo "CSC_LINK<<EOF" >> "$GITHUB_ENV"
            echo "$CSC_LINK_SECRET" >> "$GITHUB_ENV"
            echo "EOF" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=${CSC_KEY_PASSWORD_SECRET}" >> "$GITHUB_ENV"
            echo "CSC_IDENTITY_AUTO_DISCOVERY=true" >> "$GITHUB_ENV"
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "No CSC_LINK — unsigned desktop build"
          fi
          if [ -n "${APPLE_ID_SECRET:-}" ]; then
            echo "APPLE_ID=${APPLE_ID_SECRET}" >> "$GITHUB_ENV"
            echo "APPLE_APP_SPECIFIC_PASSWORD=${APPLE_APP_SPECIFIC_PASSWORD_SECRET}" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=${APPLE_TEAM_ID_SECRET}" >> "$GITHUB_ENV"
            echo "ASC_PROVIDER=${ASC_PROVIDER_SECRET}" >> "$GITHUB_ENV"
          fi

      - name: Build desktop (desktop-ui + electron-builder)
        working-directory: apps/desktop
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL != '' && vars.VITE_API_URL || 'https://api.dracord.com.tr' }}
        run: yarn ${{ matrix.script }}

      - name: SHA256 checksums
        working-directory: apps/desktop/release
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(*.exe *.msi *.dmg *.AppImage *.zip *.blockmap)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No release artifacts to hash"
            exit 0
          fi
          {
            echo "# Dracord desktop checksums (${{ matrix.os }})"
            echo "# Generated by desktop-release.yml — verify before install"
            for f in "${files[@]}"; do
              if command -v sha256sum >/dev/null 2>&1; then
                sha256sum "$f"
              else
                shasum -a 256 "$f"
              fi
            done
          } | tee SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dracord-desktop-${{ matrix.os }}
          path: |
            apps/desktop/release/*
            !apps/desktop/release/**/*.yaml
            !apps/desktop/release/**/*.yml
          if-no-files-found: warn

      - name: Attach to GitHub Release (tag push)
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/desktop/release/**
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
