name: Desktop release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release tag (ör. desktop-v0.1.0). Boşsa yalnız artifact.'
        required: false
        default: 'desktop-v0.1.0'
        type: string
      publish_release:
        description: 'Artifact’ları public GitHub Release’e yükle'
        required: false
        default: true
        type: boolean
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
          - os: macos-latest
            script: build:mac
          - os: ubuntu-latest
            script: build:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        run: yarn install --immutable

      # secrets.X yokken Actions boş string enjekte eder; electron-builder boş CSC_LINK'i
      # dosya yolu sanır → "…/apps/desktop not a file". Gerçek isimleri yalnız doluysa export et.
      - name: Build desktop (desktop-ui + electron-builder)
        working-directory: apps/desktop
        shell: bash
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL != '' && vars.VITE_API_URL || 'https://api.dracord.com.tr' }}
          CSC_LINK_RAW: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD_RAW: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID_RAW: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD_RAW: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID_RAW: ${{ secrets.APPLE_TEAM_ID }}
          ASC_PROVIDER_RAW: ${{ secrets.ASC_PROVIDER }}
        run: |
          set -euo pipefail
          unset CSC_LINK CSC_KEY_PASSWORD WIN_CSC_LINK WIN_CSC_KEY_PASSWORD \
            APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID ASC_PROVIDER || true

          if [ -n "${CSC_LINK_RAW:-}" ]; then
            export CSC_LINK="$CSC_LINK_RAW"
            export CSC_KEY_PASSWORD="${CSC_KEY_PASSWORD_RAW:-}"
            export CSC_IDENTITY_AUTO_DISCOVERY=true
            echo "Code signing: CSC_LINK set"
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            echo "Code signing: skipped (no CSC_LINK)"
          fi

          if [ -n "${APPLE_ID_RAW:-}" ]; then
            export APPLE_ID="$APPLE_ID_RAW"
            export APPLE_APP_SPECIFIC_PASSWORD="${APPLE_APP_SPECIFIC_PASSWORD_RAW:-}"
            export APPLE_TEAM_ID="${APPLE_TEAM_ID_RAW:-}"
            export ASC_PROVIDER="${ASC_PROVIDER_RAW:-}"
          fi

          yarn ${{ matrix.script }}

      # Yalnız installer paketleri — mac .app / win unpacked içeriği Release’e gitmesin
      - name: Stage distributables
        working-directory: apps/desktop/release
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p ../dist-upload
          # Installer + electron-updater metadata (latest.yml / latest-mac.yml / latest-linux.yml)
          files=(*.exe *.msi *.dmg *.AppImage *.blockmap latest.yml latest-mac.yml latest-linux.yml)
          found=()
          for f in "${files[@]}"; do
            [[ -f "$f" ]] && found+=("$f")
          done
          if [ ${#found[@]} -eq 0 ]; then
            echo "No distributable packages found"
            ls -la || true
            exit 1
          fi
          {
            echo "# Dracord desktop checksums (${{ matrix.os }})"
            echo "# Generated by desktop-release.yml — verify before install"
            for f in "${found[@]}"; do
              cp -n "$f" ../dist-upload/
              if command -v sha256sum >/dev/null 2>&1; then
                sha256sum "$f"
              else
                shasum -a 256 "$f"
              fi
            done
          } | tee "../dist-upload/SHA256SUMS-${{ matrix.os }}.txt"
          ls -lah ../dist-upload

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dracord-desktop-${{ matrix.os }}
          path: apps/desktop/dist-upload/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    if: >-
      startsWith(github.ref, 'refs/tags/desktop-v') ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.publish_release == true &&
       inputs.release_tag != '')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dracord-desktop-*
          path: release-assets
          merge-multiple: true

      - name: List assets
        run: ls -lah release-assets

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && github.ref_name || inputs.release_tag }}
          name: Dracord Desktop ${{ startsWith(github.ref, 'refs/tags/desktop-v') && github.ref_name || inputs.release_tag }}
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          # electron-updater “latest” release’i kullanır — draft/prerelease olmasın
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
