name: Desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
          - os: macos-latest
            script: build:mac
          - os: ubuntu-latest
            script: build:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        run: yarn install --immutable

      - name: Build desktop (desktop-ui + electron-builder)
        working-directory: apps/desktop
        env:
          # Native UI prod API
          VITE_API_URL: ${{ vars.VITE_API_URL != '' && vars.VITE_API_URL || 'https://api.dracord.com.tr' }}
          # Windows Authenticode — secrets yoksa imzasız build (SmartScreen uyarısı beklenir)
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # macOS notarize — APPLE_* doluysa electron-builder notarize eder (Developer hesabı yeter; ekstra ücret yok)
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_PROVIDER: ${{ secrets.ASC_PROVIDER }}
        run: yarn ${{ matrix.script }}

      - name: SHA256 checksums
        working-directory: apps/desktop/release
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(*.exe *.msi *.dmg *.AppImage *.zip *.blockmap)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No release artifacts to hash"
            exit 0
          fi
          {
            echo "# Dracord desktop checksums (${{ matrix.os }})"
            echo "# Generated by desktop-release.yml — verify before install"
            for f in "${files[@]}"; do
              if command -v sha256sum >/dev/null 2>&1; then
                sha256sum "$f"
              else
                shasum -a 256 "$f"
              fi
            done
          } | tee SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dracord-desktop-${{ matrix.os }}
          path: |
            apps/desktop/release/*
            !apps/desktop/release/**/*.yaml
            !apps/desktop/release/**/*.yml
          if-no-files-found: warn

      - name: Attach to GitHub Release (tag push)
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/desktop/release/**
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
