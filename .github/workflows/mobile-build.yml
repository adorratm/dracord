name: Mobile store build

# Elle tetiklenir: EAS bulutunda yeni mağaza ikilisi derler (native modül eklendiğinde gerekir).
# Mağazaya gönderim (submit) isteğe bağlı; EAS'ta Apple/Google kimlikleri tanımlı olmalı.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform"
        type: choice
        options: [all, android, ios]
        default: all
      submit:
        description: "Derleme bitince mağazaya gönder (EAS submit)"
        type: boolean
        default: false

concurrency:
  group: mobile-store-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check EXPO_TOKEN
        id: token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [[ -z "${EXPO_TOKEN:-}" ]]; then
            echo "EXPO_TOKEN secret yok — derleme yapılamaz" >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install
        run: yarn install --immutable

      - name: EAS build (production)
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          ARGS=(--platform "${{ inputs.platform }}" --profile production --non-interactive --no-wait)
          if [[ "${{ inputs.submit }}" == "true" ]]; then
            ARGS+=(--auto-submit)
          fi
          npx --yes eas-cli@latest build "${ARGS[@]}"
          echo "Derleme EAS kuyruğunda — durum: https://expo.dev (proje sayfası › Builds)"
