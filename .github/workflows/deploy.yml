name: Deploy production

# Build images on GitHub-hosted runners (NOT on the Hetzner VPS), push to GHCR,
# then SSH only to pull + rolling restart. Building on the VPS starves shared
# nginx / other sites (502 on kiliccoffee, portfolio, etc.).
#
# Required secrets:
#   HETZNER_HOST, HETZNER_USER, HETZNER_SSH_KEY
# Optional:
#   HETZNER_SSH_PORT, DRACORD_DEPLOY_PATH, DRACORD_DEPLOY_BRANCH, DRACORD_REPLICAS
#   DRACORD_IMAGE_PREFIX (default ghcr.io/<owner>/dracord)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # ghcr.io/adorratm/dracord/{api,web,admin}
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/dracord

jobs:
  build:
    name: Build images (GHCR)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - service: api
            dockerfile: docker/Dockerfile.api
            build_args: ""
          - service: web
            dockerfile: docker/Dockerfile.web
            build_args: |
              NEXT_PUBLIC_API_URL=https://api.dracord.com.tr
              NEXT_PUBLIC_LIVEKIT_URL=wss://rtc.dracord.com.tr
              NEXT_PUBLIC_SITE_URL=https://dracord.com.tr
          - service: admin
            dockerfile: docker/Dockerfile.admin
            build_args: |
              NEXT_PUBLIC_API_URL=https://api.dracord.com.tr
              NEXT_PUBLIC_WEB_URL=https://dracord.com.tr
              NEXT_PUBLIC_SITE_URL=https://dracord.com.tr
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      image_prefix: ${{ env.IMAGE_PREFIX }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image tag
        id: meta
        run: echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=dracord-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=dracord-${{ matrix.service }}
          provenance: false

  deploy:
    name: Hetzner pull + roll
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    steps:
      - name: Require deploy secrets
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          set -euo pipefail
          missing=0
          [[ -n "${HETZNER_HOST:-}" ]] || { echo "Missing secret HETZNER_HOST"; missing=1; }
          [[ -n "${HETZNER_USER:-}" ]] || { echo "Missing secret HETZNER_USER"; missing=1; }
          [[ -n "${HETZNER_SSH_KEY:-}" ]] || { echo "Missing secret HETZNER_SSH_KEY"; missing=1; }
          exit "$missing"

      - name: Pull images + rolling deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.HETZNER_SSH_PORT != '' && secrets.HETZNER_SSH_PORT || 22 }}
          command_timeout: 20m
          script_stop: true
          debug: false
          envs: DRACORD_DEPLOY_PATH,DRACORD_DEPLOY_BRANCH,DRACORD_REPLICAS,DRACORD_IMAGE_TAG,DRACORD_IMAGE_PREFIX,GHCR_TOKEN,GHCR_USER
          script: |
            set -euo pipefail
            export DRACORD_DEPLOY_PATH="${DRACORD_DEPLOY_PATH:-/opt/dracord}"
            export DRACORD_DEPLOY_BRANCH="${DRACORD_DEPLOY_BRANCH:-main}"
            export DRACORD_REPLICAS="${DRACORD_REPLICAS:-2}"
            export DRACORD_COMPOSE_PROD=1
            export DRACORD_IMAGE_TAG="${DRACORD_IMAGE_TAG}"
            export DRACORD_IMAGE_PREFIX="${DRACORD_IMAGE_PREFIX}"
            export DRACORD_USE_REGISTRY=1
            if [[ ! -d "$DRACORD_DEPLOY_PATH/.git" ]]; then
              echo "Missing clone at $DRACORD_DEPLOY_PATH — create it once on the server."
              exit 1
            fi
            if [[ ! -f "$DRACORD_DEPLOY_PATH/.env" ]]; then
              echo "Missing $DRACORD_DEPLOY_PATH/.env on server (never commit .env)."
              exit 1
            fi
            # GHCR auth (token is job-scoped; packages should allow this repo’s GITHUB_TOKEN)
            if [[ -n "${GHCR_TOKEN:-}" ]]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "${GHCR_USER:-adorratm}" --password-stdin
            fi
            cd "$DRACORD_DEPLOY_PATH"
            git fetch --prune origin
            git checkout "$DRACORD_DEPLOY_BRANCH"
            git reset --hard "origin/$DRACORD_DEPLOY_BRANCH"
            export DRACORD_SKIP_GIT=1
            bash docker/deploy-remote.sh
        env:
          DRACORD_DEPLOY_PATH: ${{ secrets.DRACORD_DEPLOY_PATH }}
          DRACORD_DEPLOY_BRANCH: ${{ secrets.DRACORD_DEPLOY_BRANCH }}
          DRACORD_REPLICAS: ${{ secrets.DRACORD_REPLICAS }}
          DRACORD_IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          DRACORD_IMAGE_PREFIX: ${{ needs.build.outputs.image_prefix }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}

      - name: Public smoke checks
        if: success()
        continue-on-error: true
        run: |
          set -euo pipefail
          sleep 5
          curl -fsS -o /dev/null -w "web %{http_code}\n" https://dracord.com.tr/health || true
          curl -fsS -o /dev/null -w "api %{http_code}\n" https://api.dracord.com.tr/health/ready || true
