name: Deploy production

# Build images on GitHub-hosted runners (NOT on the Hetzner VPS), push to GHCR,
# then SSH only to pull + rolling restart. Building on the VPS starves shared
# nginx / other sites (502 on kiliccoffee, portfolio, etc.).
#
# Required secrets:
#   HETZNER_HOST, HETZNER_USER, HETZNER_SSH_KEY
# Optional:
#   HETZNER_SSH_PORT, DRACORD_DEPLOY_PATH, DRACORD_DEPLOY_BRANCH, DRACORD_REPLICAS
#   DRACORD_IMAGE_PREFIX (default ghcr.io/<owner>/dracord)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # ghcr.io/adorratm/dracord/{api,web,admin}
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/dracord

jobs:
  build:
    name: Build images (GHCR)
    # desktop version bump commit’leri ([skip ci]) yeniden deploy etmesin
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message || '', '[skip ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - service: api
            dockerfile: docker/Dockerfile.api
            build_args: ""
          - service: web
            dockerfile: docker/Dockerfile.web
            # Public indirme URL’leri — vars.* bazen matrix build-args’a boş geçiyor;
            # bu yüzden burada sabitleniyor (override: workflow vars ile değiştirilebilir).
            build_args: |
              NEXT_PUBLIC_API_URL=https://api.dracord.com.tr
              NEXT_PUBLIC_LIVEKIT_URL=wss://rtc.dracord.com.tr
              NEXT_PUBLIC_SITE_URL=https://dracord.com.tr
              NEXT_PUBLIC_DOWNLOAD_WINDOWS=https://github.com/adorratm/dracord/releases/latest/download/Dracord-Setup-Windows.exe
              NEXT_PUBLIC_DOWNLOAD_LINUX=https://github.com/adorratm/dracord/releases/latest/download/Dracord-linux.AppImage
              NEXT_PUBLIC_DOWNLOAD_MACOS=https://github.com/adorratm/dracord/releases/latest/download/Dracord-mac.dmg
              NEXT_PUBLIC_DOWNLOAD_PLAY=https://play.google.com/store/apps/details?id=com.dracord.mobile
              NEXT_PUBLIC_DOWNLOAD_IOS=
          - service: admin
            dockerfile: docker/Dockerfile.admin
            build_args: |
              NEXT_PUBLIC_API_URL=https://api.dracord.com.tr
              NEXT_PUBLIC_WEB_URL=https://dracord.com.tr
              NEXT_PUBLIC_SITE_URL=https://dracord.com.tr
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      image_prefix: ${{ env.IMAGE_PREFIX }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image tag
        id: meta
        run: echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=dracord-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=dracord-${{ matrix.service }}
          provenance: false

  deploy:
    name: Hetzner pull + roll
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    steps:
      - name: Require deploy secrets
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          set -euo pipefail
          missing=0
          [[ -n "${HETZNER_HOST:-}" ]] || { echo "Missing secret HETZNER_HOST"; missing=1; }
          [[ -n "${HETZNER_USER:-}" ]] || { echo "Missing secret HETZNER_USER"; missing=1; }
          [[ -n "${HETZNER_SSH_KEY:-}" ]] || { echo "Missing secret HETZNER_SSH_KEY"; missing=1; }
          exit "$missing"

      # appleboy/ssh-action — native OpenSSH bazı key secret formatlarında
      # "Permission denied (publickey)" veriyordu; appleboy key parse’ı güvenilir.
      - name: Pull images + rolling deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.HETZNER_SSH_PORT != '' && secrets.HETZNER_SSH_PORT || 22 }}
          command_timeout: 20m
          script_stop: true
          timeout: 60s
          debug: false
          envs: DRACORD_DEPLOY_PATH,DRACORD_DEPLOY_BRANCH,DRACORD_REPLICAS,DRACORD_IMAGE_TAG,DRACORD_IMAGE_PREFIX,GHCR_TOKEN,GHCR_USER
          script: |
            set -euo pipefail
            export DRACORD_DEPLOY_PATH="${DRACORD_DEPLOY_PATH:-/opt/dracord}"
            export DRACORD_DEPLOY_BRANCH="${DRACORD_DEPLOY_BRANCH:-main}"
            export DRACORD_REPLICAS="${DRACORD_REPLICAS:-2}"
            export DRACORD_COMPOSE_PROD=1
            export DRACORD_IMAGE_TAG="${DRACORD_IMAGE_TAG}"
            export DRACORD_IMAGE_PREFIX="${DRACORD_IMAGE_PREFIX}"
            export DRACORD_USE_REGISTRY=1
            if [[ ! -d "$DRACORD_DEPLOY_PATH/.git" ]]; then
              echo "Missing clone at $DRACORD_DEPLOY_PATH — create it once on the server."
              exit 1
            fi
            if [[ ! -f "$DRACORD_DEPLOY_PATH/.env" ]]; then
              echo "Missing $DRACORD_DEPLOY_PATH/.env on server (never commit .env)."
              exit 1
            fi
            if [[ -n "${GHCR_TOKEN:-}" ]]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "${GHCR_USER:-adorratm}" --password-stdin
            fi
            cd "$DRACORD_DEPLOY_PATH"
            git fetch --prune origin
            git checkout "$DRACORD_DEPLOY_BRANCH"
            git reset --hard "origin/$DRACORD_DEPLOY_BRANCH"
            export DRACORD_SKIP_GIT=1
            bash docker/deploy-remote.sh
        env:
          DRACORD_DEPLOY_PATH: ${{ secrets.DRACORD_DEPLOY_PATH }}
          DRACORD_DEPLOY_BRANCH: ${{ secrets.DRACORD_DEPLOY_BRANCH }}
          DRACORD_REPLICAS: ${{ secrets.DRACORD_REPLICAS }}
          DRACORD_IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          DRACORD_IMAGE_PREFIX: ${{ needs.build.outputs.image_prefix }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}

      - name: Public smoke checks
        if: success()
        continue-on-error: true
        run: |
          set -euo pipefail
          sleep 5
          curl -fsS -o /dev/null -w "web %{http_code}\n" https://dracord.com.tr/health || true
          curl -fsS -o /dev/null -w "api %{http_code}\n" https://api.dracord.com.tr/health/ready || true

  # Deploy yeşil → istemci güncellemeleri (EAS OTA + desktop version bump)
  client-updates:
    name: Client updates (OTA + desktop)
    needs: deploy
    if: success()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # electron-updater aynı semver’i güncelleme saymaz. Desktop kodu değiştiyse
      # (veya manuel deploy) auto_bump ile yeni patch + latest.yml yayınla.
      - name: Detect desktop client changes
        id: desk
        shell: bash
        run: |
          set -euo pipefail
          CHANGED=false
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            CHANGED=true
          elif [[ -n "${{ github.event.before }}" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" \
              | grep -E '^(apps/desktop/|apps/desktop-ui/)' >/dev/null; then
              CHANGED=true
            fi
          else
            # shallow / ilk push — desktop dosyalarına bak
            if git ls-tree -r --name-only "${{ github.sha }}" \
              | grep -E '^(apps/desktop/|apps/desktop-ui/)' >/dev/null; then
              CHANGED=true
            fi
          fi
          echo "changed=${CHANGED}" >> "$GITHUB_OUTPUT"
          echo "Desktop client changed: ${CHANGED}"

      - name: Trigger desktop-release (auto-bump)
        if: steps.desk.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CUR=$(node -p "require('./apps/desktop/package.json').version")
          echo "Current desktop package.json: ${CUR} — auto_bump new patch"
          # Boş release_tag → workflow patch bump eder (aynı 0.1.0 ile güncelleme çıkmaz)
          gh workflow run desktop-release.yml \
            --ref "${{ github.ref_name }}" \
            -f release_tag= \
            -f publish_release=true \
            -f auto_bump=true
          echo "Triggered desktop-release (auto_bump from ${CUR})"

      # EXPO_TOKEN yokken setup-node + cache:yarn çalıştırmayın: install atlanırsa
      # post-job "Path(s) specified for caching do not exist" ile düşer.
      - name: Check EXPO_TOKEN
        id: expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [[ -n "${EXPO_TOKEN:-}" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "EXPO_TOKEN secret yok — EAS OTA atlandı"
          fi

      - name: Enable Corepack
        if: steps.expo.outputs.present == 'true'
        run: corepack enable

      - name: Setup Node
        if: steps.expo.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Publish EAS Update (production)
        if: steps.expo.outputs.present == 'true'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          yarn install --immutable
          npx eas-cli update --channel production --non-interactive --message "deploy ${{ github.sha }}" || {
            echo "EAS update skipped or failed (projectId / channel may be incomplete)"
            exit 0
          }
