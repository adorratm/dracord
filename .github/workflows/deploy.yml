name: Deploy production

# Public repository: no secrets in this file. Configure GitHub → Settings → Secrets
# and (recommended) Environments → production with required reviewers.
#
# Required secrets:
#   HETZNER_HOST, HETZNER_USER, HETZNER_SSH_KEY
# Optional:
#   HETZNER_SSH_PORT (default 22), DRACORD_DEPLOY_PATH, DRACORD_DEPLOY_BRANCH, DRACORD_REPLICAS
#
# Server must hold /opt/dracord/.env (never commit). Deploy refuses example secrets.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Hetzner rolling deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Create Environment "production" in GitHub for optional approval gates.
    environment: production
    steps:
      - name: Require deploy secrets
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          set -euo pipefail
          missing=0
          [[ -n "${HETZNER_HOST:-}" ]] || { echo "Missing secret HETZNER_HOST"; missing=1; }
          [[ -n "${HETZNER_USER:-}" ]] || { echo "Missing secret HETZNER_USER"; missing=1; }
          [[ -n "${HETZNER_SSH_KEY:-}" ]] || { echo "Missing secret HETZNER_SSH_KEY"; missing=1; }
          exit "$missing"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.HETZNER_SSH_PORT != '' && secrets.HETZNER_SSH_PORT || 22 }}
          command_timeout: 40m
          script_stop: true
          # Do not enable debug — would risk leaking remote output with secrets.
          debug: false
          envs: DRACORD_DEPLOY_PATH,DRACORD_DEPLOY_BRANCH,DRACORD_REPLICAS
          script: |
            set -euo pipefail
            export DRACORD_DEPLOY_PATH="${DRACORD_DEPLOY_PATH:-/opt/dracord}"
            export DRACORD_DEPLOY_BRANCH="${DRACORD_DEPLOY_BRANCH:-main}"
            export DRACORD_REPLICAS="${DRACORD_REPLICAS:-2}"
            export DRACORD_COMPOSE_PROD=1
            if [[ ! -d "$DRACORD_DEPLOY_PATH/.git" ]]; then
              echo "Missing clone at $DRACORD_DEPLOY_PATH — create it once on the server."
              exit 1
            fi
            if [[ ! -f "$DRACORD_DEPLOY_PATH/.env" ]]; then
              echo "Missing $DRACORD_DEPLOY_PATH/.env on server (never commit .env)."
              exit 1
            fi
            cd "$DRACORD_DEPLOY_PATH"
            git fetch --prune origin
            git checkout "$DRACORD_DEPLOY_BRANCH"
            git reset --hard "origin/$DRACORD_DEPLOY_BRANCH"
            export DRACORD_SKIP_GIT=1
            bash docker/deploy-remote.sh
        env:
          DRACORD_DEPLOY_PATH: ${{ secrets.DRACORD_DEPLOY_PATH }}
          DRACORD_DEPLOY_BRANCH: ${{ secrets.DRACORD_DEPLOY_BRANCH }}
          DRACORD_REPLICAS: ${{ secrets.DRACORD_REPLICAS }}

      - name: Public smoke checks
        if: success()
        continue-on-error: true
        run: |
          set -euo pipefail
          sleep 5
          curl -fsS -o /dev/null -w "web %{http_code}\n" https://dracord.com.tr/health || true
          curl -fsS -o /dev/null -w "api %{http_code}\n" https://api.dracord.com.tr/health/ready || true
