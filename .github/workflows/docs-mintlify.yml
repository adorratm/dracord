name: Docs (Mintlify check)

# Public Mintlify content: docs/mintlify only.
# Dashboard → Docs directory MUST be docs/mintlify (not docs/).

on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/mintlify/**'
      - 'scripts/check-docs.mjs'
      - 'apps/docs/**'
      - '.github/workflows/docs-mintlify.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
      - name: Enable Corepack
        run: corepack enable
      - name: Validate docs.json + required pages
        run: node scripts/check-docs.mjs
      - name: Install + build Next docs
        run: |
          yarn install --immutable
          yarn workspace @dracord/docs build
