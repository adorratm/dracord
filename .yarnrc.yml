nodeLinker: node-modules

yarnPath: .yarn/releases/yarn-4.18.1.cjs

# Shared cache path (Docker BuildKit mounts /root/.yarn/berry/cache)
enableGlobalCache: true
enableTelemetry: false
# CI=1 disables scripts by default — need bcrypt/esbuild native builds in Docker
enableScripts: true

# Yarn 4 defaults can quarantine brand-new npm publishes (~24h).
# That blocked expo@57.0.29 (YN0016). Keep gate off so SDK patch bumps install.
# Re-enable with e.g. 1440 if you want delayed installs again.
npmMinimalAgeGate: 0
