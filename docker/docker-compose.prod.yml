# Production override for Hetzner (Nginx terminates TLS on host / Docker Nginx).
# Does NOT bind 80/443 — other sites keep their Nginx vhosts.
#
# Replicas: api/web/admin MUST NOT publish host ports (all would fight for :14000).
# `edge` (Caddy) listens on 127.0.0.1:{13000,13001,14000} and LB's to Docker DNS.
# Also joins TTEN docker network as `dracord-edge` for ttengamesstudio-nginx.
#
# Public routing: bash docker/sync-dracord-nginx.sh http|https

services:
  postgres:
    ports: !reset []

  pgbouncer:
    ports: !reset []

  redis:
    ports: !reset []

  elasticsearch:
    ports: !reset []
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms512m -Xmx512m}

  livekit:
    command: ["--config", "/etc/livekit.yaml", "--bind", "0.0.0.0"]
    volumes:
      - ./livekit.prod.yaml:/etc/livekit.yaml:ro
    ports:
      - "127.0.0.1:17880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    networks:
      public:
      tten_edge:
        aliases:
          - dracord-livekit

  # No host ports — scaled replicas share Docker DNS name only
  api:
    ports: !reset []
    expose:
      - "4000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_SYNCHRONIZE: ${DATABASE_SYNCHRONIZE:-false}
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-wss://rtc.dracord.com.tr}
      MUSIC_BOT_LIVEKIT_URL: ws://livekit:7880
      FRONTEND_URL: ${FRONTEND_URL:-https://dracord.com.tr}
      ADMIN_URL: ${ADMIN_URL:-https://admin.dracord.com.tr}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-emrekilic19983@gmail.com}
    depends_on: !reset
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      livekit:
        condition: service_started

  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    restart: unless-stopped
    init: true
    networks:
      - internal

  music-bot:
    environment:
      LIVEKIT_URL: ws://livekit:7880
      API_URL: http://api:4000
      YTDLP_COOKIES_FILE: ${YTDLP_COOKIES_FILE:-/cookies/youtube.txt}
      YTDLP_EXTRACTOR_ARGS: ${YTDLP_EXTRACTOR_ARGS:-youtubepot-bgutilhttp:base_url=http://bgutil-provider:4416}
      YTDLP_COOKIES_B64: ${YTDLP_COOKIES_B64:-}
      YTDLP_IMPERSONATE: ${YTDLP_IMPERSONATE:-1}
      YTDLP_PROXY: ${YTDLP_PROXY:-}
      YTDLP_RELAY_URL: ${YTDLP_RELAY_URL:-}
      YTDLP_RELAY_SECRET: ${YTDLP_RELAY_SECRET:-}
    volumes:
      - ${YTDLP_COOKIES_HOST_PATH:-/opt/dracord/secrets/youtube-cookies.txt}:/cookies/youtube.txt:ro

  web:
    ports: !reset []
    expose:
      - "3000"
    # Docker injects HOSTNAME=containerId; override at process start (ENV alone is not enough).
    command: ["sh", "-c", "export HOSTNAME=0.0.0.0; exec node apps/web/server.js"]
    environment:
      HOSTNAME: "0.0.0.0"
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.dracord.com.tr}
        NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL:-wss://rtc.dracord.com.tr}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://dracord.com.tr}

  admin:
    ports: !reset []
    expose:
      - "3000"
    command: ["sh", "-c", "export HOSTNAME=0.0.0.0; exec node apps/admin/server.js"]
    environment:
      HOSTNAME: "0.0.0.0"
    build:
      context: ..
      dockerfile: docker/Dockerfile.admin
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.dracord.com.tr}

  # Loopback edge LB — one listener per port, upstream = all replicas
  edge:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
      - admin
    ports:
      - "127.0.0.1:13000:13000"
      - "127.0.0.1:13001:13001"
      - "127.0.0.1:14000:14000"
    volumes:
      - ./Caddyfile.edge:/etc/caddy/Caddyfile:ro
    networks:
      public:
      tten_edge:
        aliases:
          - dracord-edge

  # Host/Docker Nginx owns 80/443 — never start Compose Caddy profile
  caddy:
    profiles: ["caddy-disabled"]
    ports: !reset []

networks:
  # Shared with ttengamesstudio-nginx (kiliccoffee / portfolio pattern)
  tten_edge:
    name: ${DRACORD_TTEN_NETWORK:-ttengamesstudio_ttengamesstudio-network}
    external: true
