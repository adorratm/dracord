# Production override for Hetzner (Nginx terminates TLS on host).
# Does NOT bind 80/443 — other sites keep their Nginx vhosts.
#
# Replicas: api/web/admin MUST NOT publish host ports (all would fight for :14000).
# `edge` (Caddy) listens on 127.0.0.1:{13000,13001,14000} and LB's to Docker DNS.
#
# Host Nginx → 127.0.0.1:13000/13001/14000/17880 → edge / livekit

services:
  postgres:
    ports: !reset []

  pgbouncer:
    ports: !reset []

  redis:
    ports: !reset []

  elasticsearch:
    ports: !reset []
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms512m -Xmx512m}

  minio:
    ports: !reset []

  livekit:
    command: ["--config", "/etc/livekit.yaml", "--bind", "0.0.0.0"]
    volumes:
      - ./livekit.prod.yaml:/etc/livekit.yaml:ro
    ports:
      - "127.0.0.1:17880:7880"
      - "7881:7881"
      - "7882:7882/udp"

  # No host ports — scaled replicas share Docker DNS name only
  api:
    ports: !reset []
    expose:
      - "4000"
    environment:
      NODE_ENV: production
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-wss://rtc.dracord.com.tr}
      MUSIC_BOT_LIVEKIT_URL: ws://livekit:7880
      FRONTEND_URL: ${FRONTEND_URL:-https://dracord.com.tr}

  music-bot:
    environment:
      LIVEKIT_URL: ws://livekit:7880
      API_URL: http://api:4000

  web:
    ports: !reset []
    expose:
      - "3000"
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.dracord.com.tr}
        NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL:-wss://rtc.dracord.com.tr}

  admin:
    ports: !reset []
    expose:
      - "3000"
    build:
      context: ..
      dockerfile: docker/Dockerfile.admin
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.dracord.com.tr}

  # Loopback edge LB — one listener per port, upstream = all replicas
  edge:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
      admin:
        condition: service_healthy
    ports:
      - "127.0.0.1:13000:13000"
      - "127.0.0.1:13001:13001"
      - "127.0.0.1:14000:14000"
    volumes:
      - ./Caddyfile.edge:/etc/caddy/Caddyfile:ro
    networks:
      - public

  # Host Nginx owns 80/443 — never start Compose Caddy profile
  caddy:
    profiles: ["caddy-disabled"]
    ports: !reset []
