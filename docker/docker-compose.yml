services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dracord}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dracord}
      POSTGRES_DB: ${POSTGRES_DB:-dracord}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dracord}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-dracord}:${POSTGRES_PASSWORD:-dracord}@postgres:5432/${POSTGRES_DB:-dracord}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
      AUTH_TYPE: scram-sha-256
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "6432:5432"
    networks:
      - internal

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s http://localhost:9200 >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    networks:
      - internal

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml", "--bind", "0.0.0.0"]
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    networks:
      - internal
      - public

  minio:
    image: localstack/localstack:3
    restart: unless-stopped
    environment:
      SERVICES: s3
      DEFAULT_REGION: ${S3_REGION:-us-east-1}
    volumes:
      - minio_data:/var/lib/localstack
    ports:
      - "9000:4566"
    networks:
      - internal
      - public

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-dracord}:${POSTGRES_PASSWORD:-dracord}@pgbouncer:5432/${POSTGRES_DB:-dracord}
      REDIS_URL: redis://redis:6379
      ELASTICSEARCH_URL: http://elasticsearch:9200
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-ws://localhost:7880}
      MUSIC_BOT_LIVEKIT_URL: ws://host.docker.internal:7880
      S3_ENDPOINT: http://minio:4566
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:9000/dracord}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-dracord}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-test}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-test}
      PORT: "4000"
      MUSIC_BOT_INTERNAL_SECRET: ${MUSIC_BOT_INTERNAL_SECRET:-dracord-music-dev}
      MUSIC_BOT_ENABLED: ${MUSIC_BOT_ENABLED:-true}
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      livekit:
        condition: service_started
      minio:
        condition: service_started
    ports:
      - "4000:4000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    networks:
      - internal
      - public

  music-bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile.music-bot
    restart: unless-stopped
    stop_grace_period: 20s
    env_file:
      - ../.env
    environment:
      REDIS_URL: redis://redis:6379
      API_URL: http://api:4000
      LIVEKIT_URL: ws://host.docker.internal:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-APIdracorddevkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret_dracord_livekit_dev_key_change_me}
      MUSIC_BOT_INTERNAL_SECRET: ${MUSIC_BOT_INTERNAL_SECRET:-dracord-music-dev}
      YTDLP_PATH: /usr/local/bin/yt-dlp
      FFMPEG_PATH: ffmpeg
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
    networks:
      - internal

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL:-ws://localhost:7880}
    restart: unless-stopped
    stop_grace_period: 20s
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    networks:
      - public

  admin:
    build:
      context: ..
      dockerfile: docker/Dockerfile.admin
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.dracord.com.tr}
    restart: unless-stopped
    stop_grace_period: 20s
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3001:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    networks:
      - public

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["prod"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      admin:
        condition: service_healthy
      api:
        condition: service_healthy
      livekit:
        condition: service_started
    networks:
      - public

volumes:
  postgres_data:
  redis_data:
  elasticsearch_data:
  minio_data:
  caddy_data:
  caddy_config:

networks:
  internal:
  public:
